title: "flaky 测试 — 共享 /tmp 固定路径(噪声 tool 输出里藏根因)"
description: >
  cargo test 概率性失败、本地单跑必过、CI 必现的典型 flaky。tool 输出是一大段编译/告警噪声,
  根因(test_writer 与 test_reader 共享写死的 /tmp/acme-fixture.db,并行互踩)藏在中间;
  修法是每个测试用独立的 tempfile::tempdir()。考点:noisy-tool-output 里能否捞出真信号 + failure 三要素(触发/原因/解法)。
