case_id: C001
title: "会话存储选型 — 定 Postgres(单段、理由清晰)"
description: >
  一段对话里讨论 AcmeChat 的会话状态存哪,排除内存后在 Postgres 与 SQLite 之间选,
  最后定 Postgres,理由两条:写入要和余额扣减放同一事务(ACID),以及后续按租户规模化查询。
  这是 §7 的首个 round-trip 校准 case;故意不在 transcript 里出现 Redis/MongoDB,
  让 summary 的反向断言(防幻觉)是干净的。与 C002 构成 contradiction 对(同问题不同答案)。
tags: [single-thread, kind-decision, mixed-keep-drop, tool-call-output-pairs, mixed-zh-en, cross-topic-false-neighbor]
multilingual: zh_majority
thread_count: 1
segment_count: 1
agent_id: test-agent-001
team_id: team-fixtures
project_hash: hash-fixtures

# >>> expected_ingest (generated by corpus_tool.py — run `verify --fix`) >>>
expected_ingest:
  raw_event_count: 22
  kept_line_nos: [4, 7, 9, 10, 11, 16, 19]
  dropped_line_nos: [1, 2, 3, 5, 6, 8, 12, 13, 14, 15, 17, 18, 20, 21, 22]
  boundary_line_nos: []
# <<< expected_ingest <<<

expected_distill:
  expected_kp_count: 1   # 单一决策;§7 live loop 可微调(harness 若按下界解释则 >=1)
  knowledge_points:
    - kind: decision
      summary_must_contain_any: ["Postgres", "PG", "postgres"]
      summary_must_not_contain: ["Redis", "MongoDB", "Mongo"]
      detail_must_mention_all:
        - ["事务", "ACID", "transaction"]
        - ["规模", "规模化", "扩展", "scale"]
      detail_must_not_mention: ["Redis", "MongoDB"]

expected_search:
  - query: "会话状态用什么存"
    limit: 3
    # 矛盾对 C001(PG)↔C002(Redis) 都应答此问;top1 不确定,改用成员制:
    # top-K 内 PG 与 Redis 必须各命中一次(每组 must_match_any 语义)。
    expected_topk_members:
      - ["Postgres", "PG"]
      - ["Redis"]
  - query: "前端时间处理用哪个库"     # cross-topic:应命中 C014(day.js),不应误冲到 PG
    limit: 3
    expected_top1_summary_must_not_match: ["Postgres", "PG"]

consolidation_relations:
  - with_case: C002
    expected_action: contradiction
    reason: "同问题(AcmeChat 会话状态存什么)不同答案:C001=Postgres(ACID+规模),C002=Redis(低延迟+TTL)。保留双方并互标 contradicts_with。"
