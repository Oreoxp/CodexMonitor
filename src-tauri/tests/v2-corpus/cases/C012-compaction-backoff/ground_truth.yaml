case_id: C012
title: "单文件多段 — compaction 边界 + prior_summary 不被抽取"
description: >
  一个文件两段,中间夹一行 type:"compacted" 边界(L15)。段1是机械环境搭建(应 0 KP);
  边界的 payload.message 携带一个"诱饵事实"(项目代号 BlueFin / 仓库 acme/bluefin);
  段2是真决策(重试改指数退避 + jitter)。考点:(a) segment_thread 正确切段;
  (b) prior_summary 只用于消歧、绝不被抽成 KP —— 故断言段2的 KP 不得出现 BlueFin。
  段内顺序天然给出时间箭头(supersede 形态),但本 case 只验证 compaction+prior_summary。
tags: [multi-segment-compaction, with-prior-summary, kind-decision, tool-call-output-pairs, mixed-zh-en]
multilingual: zh_majority
thread_count: 1
segment_count: 2
agent_id: test-agent-001
team_id: team-fixtures
project_hash: hash-fixtures

# >>> expected_ingest (generated by corpus_tool.py — run `verify --fix`) >>>
expected_ingest:
  raw_event_count: 29
  kept_line_nos: [4, 7, 9, 10, 11, 17, 20, 23, 26]
  dropped_line_nos: [1, 2, 3, 5, 6, 8, 12, 13, 14, 16, 18, 19, 21, 22, 24, 25, 27, 28, 29]
  boundary_line_nos: [15]
# <<< expected_ingest <<<

# 多段:用 expected_distill_segments 列表,顺序对应 segment_thread 的输出。
expected_distill_segments:
  - segment_index: 1
    expected_kp_count: 0          # 纯环境搭建,无 durable lesson
    knowledge_points: []
  - segment_index: 2
    expected_kp_count: 1
    prior_summary_note: >
      该段的 prior_summary = 边界 payload.message,含 'BlueFin'/'acme/bluefin' 诱饵。
      EXTRACTION_PROMPT 规定 prior 只用于消歧、不得抽取。下面的反向断言即验证这一点。
    knowledge_points:
      - kind: decision
        summary_must_contain_any: ["指数退避", "退避", "backoff", "exponential", "重试", "jitter"]
        summary_must_not_contain: ["BlueFin", "bluefin"]
        detail_must_mention_all:
          - ["jitter", "抖动"]
          - ["100ms", "10s", "基数", "上限", "固定"]
        detail_must_not_mention: ["BlueFin", "bluefin", "acme/bluefin"]
