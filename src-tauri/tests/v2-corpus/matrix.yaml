# V2 Corpus — coverage matrix (dimension -> cases). Phase 2 = 40 cases.
# Source of truth for tags = each case's `tags:`; this file aggregates.
# Empty dimensions name the phase that fills them.

phase: 2
case_count: 40

# ---- S2 (ingest / parse_line classification) ----
s2:
  single-thread:            [C001, C002, C003, C004, C005, C006, C007, C008, C009, C010, C011, C013, C014, C015, C016, C017, C018, C019, C020, C021, C022, C023, C024, C025, C026, C027, C028, C029, C030, C031, C032, C033, C034, C035, C036, C037, C038, C040]
  multi-segment-compaction: [C012]
  all-dropped:              [C013]
  tool-call-output-pairs:   [C001, C003, C004, C005, C006, C007, C009, C012, C039]
  utf8-multibyte:           [C006]
  long-truncation:          [C039]          # >48k rendered chars; keep-tail/drop-head

# ---- S3 (distillation) — positive (case-level content gate; kind advisory) ----
s3_positive:
  kind-decision: [C001, C002, C012, C014, C015, C016, C017, C018, C019, C020, C021, C022, C023, C024, C035, C037]
  kind-failure:  [C003, C004, C039]
  kind-pattern:  [C005, C025, C026, C027, C028, C029, C031, C032, C033, C034, C036, C038, C040]
  kind-fact:     [C006, C007, C030]
  # NOTE: kind is ADVISORY in the harness (temp 0.2 framing varies); the above
  # is the *intended* framing, not a hard assertion.

# ---- S3 — reverse: should yield [] ----
s3_reverse:
  greeting-only:             [C008]
  task-complete-no-learning: [C009]
  chitchat:                  [C010]
  aborted:                   [C011]          # hardened: assistant gives zero durable advice

# ---- S3 — boundary / language ----
s3_boundary:
  pure-zh:            [C010, C011, C017, C018, C035, C040]
  pure-en:           [C004, C008]
  mixed-zh-en:        [C001, C002, C003, C005, C006, C007, C009, C012, C014, C015, C016, C019, C020, C021, C022, C023, C024, C025, C026, C027, C028, C029, C030, C031, C032, C033, C034, C036, C037, C038, C039]
  with-prior-summary: [C012]
  noisy-tool-output:  [C003, C007]
  summary-fts-v8:     [C040]                 # CJK discriminator lands in summary (v8 gap)

# ---- S4 (retrieval) — scenario-scoped (one DB per group) ----
s4:
  cross-topic-false-neighbor: [C001]         # C001 carries cross-topic negative query (vs C014, session group)
  summary-fts-observe:        [C040]         # FTS-only = 0 in v7 (documented v8 gap)

# ---- S5 (consolidation) — relation pairs (data + ground_truth only; no Layer D yet) ----
s5_relations:
  contradiction:   [[C001, C002], [C015, C016], [C017, C018]]
  supersede:       [[C019, C020], [C021, C022], [C023, C024]]    # older.superseded_by newer (created_at_offset)
  false_neighbor:  [[C025, C026], [C027, C028], [C029, C030]]    # near but no_action (precision gate)
  duplicate:       [[C031, C032], [C033, C034]]                  # near-synonym -> merge
  complement:      [[C035, C036], [C037, C038]]                  # same topic, both survive (cluster)
  # accidental intra-group no_action audited explicitly where it is a precision
  # signal (e.g. messaging cross-time C020<->C023); far pairs default no_action.

# ---- S5 scenario groups (co-located = one DB; S5 considers all intra-group pairs) ----
s5_groups:
  session:        [C001, C002, C014]   # contradiction + C014 cross-topic anchor
  auth:           [C015, C016]         # contradiction
  deploy:         [C017, C018]         # contradiction
  messaging:      [C019, C020, C023, C024]  # RICH: 2 supersede + 4 audited no_action (incl cross-time trap)
  frontend:       [C021, C022]         # supersede
  pg-aspects:     [C025, C026]         # false_neighbor
  redis-aspects:  [C027, C028]         # false_neighbor
  kafka-aspects:  [C029, C030]         # false_neighbor (orthogonal layers)
  retry-dup:      [C031, C032]         # duplicate
  logging-dup:    [C033, C034]         # duplicate
  pg-store:       [C035, C036]         # complement
  kafka-bus:      [C037, C038]         # complement
  ratelimit:      [C040]               # summary-fts search
  ungrouped:      [C003, C004, C005, C006, C007, C008, C009, C010, C012, C013, C039]  # Layer-B only

# ---- reverse index: case -> declared tags ----
cases:
  C001: [single-thread, kind-decision, mixed-keep-drop, tool-call-output-pairs, mixed-zh-en, cross-topic-false-neighbor, s5-contradiction, group-session]
  C002: [single-thread, kind-decision, mixed-keep-drop, mixed-zh-en, s5-contradiction, group-session]
